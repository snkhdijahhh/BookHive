<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse the BookHive catalog — Malaysian books, novels, fiction, and more." />
  <title>Books | BookHive</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="app-wrapper">
    <div id="navbar"></div>

    <main class="container py-4 py-lg-5 flex-grow-1">
      
      <!-- Header -->
      <div class="books-header d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center">
          <div class="header-icon shadow-sm">
            <i class="bi bi-book"></i>
          </div>
          <div>
            <h1 class="h2 fw-bold mb-1">Book Catalog</h1>
            <p class="text-muted mb-0">
              Browse <span id="bookCount" class="fw-bold text-dark">0</span> titles — Malaysian classics, fiction, fantasy, and more
            </p>
          </div>
        </div>
        
        <!-- Search Bar -->
        <div class="input-group shadow-sm" style="max-width: 350px; border-radius: 20px; overflow: hidden;">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
          <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Search title, author, category..." />
        </div>
      </div>

      <!-- Category filter pills -->
      <div class="d-flex flex-wrap gap-2 mb-4" id="categoryFilter">
        <button class="btn btn-sm category-btn active" data-category="all">All</button>
        <button class="btn btn-sm category-btn" data-category="Malaysia">Malaysia</button>
        <button class="btn btn-sm category-btn" data-category="Fiction">Fiction</button>
        <button class="btn btn-sm category-btn" data-category="Fantasy">Fantasy</button>
        <button class="btn btn-sm category-btn" data-category="Thriller">Thriller</button>
        <button class="btn btn-sm category-btn" data-category="Romance">Romance</button>
        <button class="btn btn-sm category-btn" data-category="Science">Science</button>
        <button class="btn btn-sm category-btn" data-category="History">History</button>
        <button class="btn btn-sm category-btn" data-category="Technology">Technology</button>
        <button class="btn btn-sm category-btn" data-category="Education">Education</button>
      </div>

      <!-- Book grid -->
      <div class="row g-4 mb-4" id="bookGrid"></div>

      <!-- Pagination Section -->
      <div class="d-flex justify-content-between align-items-center mt-4">
        <div class="text-muted small" id="pageInfo">Showing 0 - 0 of 0 books</div>
        
        <nav aria-label="Page navigation">
          <ul class="pagination vintage-pagination mb-0" id="pagination">
            <li class="page-item" id="prevBtn">
              <a class="page-link" href="javascript:void(0)" onclick="changePage('prev')"><i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item" id="nextBtn">
              <a class="page-link" href="javascript:void(0)" onclick="changePage('next')"><i class="bi bi-chevron-right"></i></a>
            </li>
          </ul>
        </nav>
      </div>

    </main>

    <div id="footer"></div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL POP-UP UNTUK BORROW BUKU             -->
  <!-- ========================================== -->
  <div class="modal fade" id="borrowModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 1rem;">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold" id="modalBookTitle">Borrow Book</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div class="row g-4">
            <div class="col-md-5 text-center">
              <img id="modalBookCover" src="" alt="Book Cover" class="img-fluid rounded shadow-sm mb-3" style="max-height: 300px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
              <h5 class="fw-bold mb-1" id="modalBookTitleInfo"></h5>
              <p class="text-muted small mb-0" id="modalBookAuthor"></p>
              <span class="badge bg-light text-dark border mt-2" id="modalBookCategory"></span>
            </div>
            <div class="col-md-7">
              <form id="borrowForm">
                <input type="hidden" id="borrowBookId">
                <h6 class="fw-bold mb-3 text-primary"><i class="bi bi-person-lines-fill"></i> Borrowing Details</h6>
                <div class="mb-3">
                  <label for="borrowMember" class="form-label">Member Name</label>
                  <input type="text" class="form-control" id="borrowMember" required placeholder="Enter your name">
                </div>
                <div class="mb-3">
                  <label for="borrowDate" class="form-label">Borrow Date</label>
                  <input type="date" class="form-control bg-light" id="borrowDate" readonly>
                  <div class="form-text text-muted">Automatically set to today.</div>
                </div>
                <div class="mb-3">
                  <label for="borrowDue" class="form-label">Due Date</label>
                  <!-- TUKAR: Buang 'readonly' supaya user boleh pilih tarikh sendiri -->
                  <input type="date" class="form-control" id="borrowDue" required>
                  <div class="form-text text-danger"><i class="bi bi-info-circle"></i> Maximum loan period is 7 days (1 week).</div>
                </div>
                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                    <i class="bi bi-bookmark-plus"></i> Confirm Borrow
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/books.js"></script>
  <script>
    Session.require();
    renderNavbar('books');
    renderFooter();
  </script>
</body>
</html>
