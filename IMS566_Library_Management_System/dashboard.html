<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BookHive dashboard — key metrics and analytics." />
  <title>Overview | BookHive</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="dashboard-body">

  <!-- BACKGROUND SLIDESHOW UNTUK DASHBOARD -->
  <div id="dashboardCarousel" class="carousel slide carousel-fade dashboard-bg" data-bs-ride="carousel" data-bs-interval="5000">
    <div class="carousel-inner h-100">
      <div class="carousel-item active h-100">
        <img src="images/slide1.jpg" class="d-block w-100 h-100" alt="Background 1" onerror="this.style.display='none';">
      </div>
      <div class="carousel-item h-100">
        <img src="images/slide2.jpg" class="d-block w-100 h-100" alt="Background 2" onerror="this.style.display='none';">
      </div>
      <div class="carousel-item h-100">
        <img src="images/slide3.jpg" class="d-block w-100 h-100" alt="Background 3" onerror="this.style.display='none';">
      </div>
    </div>
  </div>
  <div class="dashboard-overlay"></div> <!-- Lapisan gelap -->

  <div class="app-wrapper position-relative">
    <div id="navbar"></div>

    <main class="container py-4 py-lg-5 flex-grow-1">
      <!-- Page heading -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 text-white">
        <div>
          <h1 class="h3 fw-bold mb-1 text-white">Overview</h1>
          <p class="text-white-50 mb-0">
            Welcome back, <span id="welcomeName" class="fw-semibold text-white">User</span> 👋
          </p>
        </div>
        <!-- BAHAGIAN BADGE SYSTEM ONLINE TELAH DIBUANG -->
      </div>

      <!-- Stat cards (Kekal Putih untuk Kontras) -->
      <div class="row g-3 g-lg-4 mb-4">
        <div class="col-6 col-lg-3">
          <div class="card stat-card p-3 h-100">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="text-muted small mb-1">Total Books</p>
                <h3 class="fw-bold mb-0" id="statTotalBooks">0</h3>
              </div>
              <span class="stat-icon bg-primary-subtle text-primary"><i class="bi bi-journal-bookmark"></i></span>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card stat-card p-3 h-100">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="text-muted small mb-1">Currently Borrowed</p>
                <h3 class="fw-bold mb-0" id="statBorrowed">0</h3>
              </div>
              <span class="stat-icon bg-warning-subtle text-warning"><i class="bi bi-arrow-left-right"></i></span>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card stat-card p-3 h-100">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="text-muted small mb-1">Available</p>
                <h3 class="fw-bold mb-0" id="statAvailable">0</h3>
              </div>
              <span class="stat-icon bg-success-subtle text-success"><i class="bi bi-check-circle"></i></span>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card stat-card p-3 h-100">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="text-muted small mb-1">Overdue</p>
                <h3 class="fw-bold mb-0 text-danger" id="statOverdue">0</h3>
              </div>
              <span class="stat-icon bg-danger-subtle text-danger"><i class="bi bi-exclamation-triangle"></i></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts row -->
      <div class="row g-3 g-lg-4 mb-4">
        <div class="col-lg-8">
          <div class="card stat-card p-3 p-lg-4 h-100">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h2 class="h5 fw-semibold mb-0">Borrowings Per Month</h2>
                <p class="text-muted small mb-0">Trend over the last 6 months</p>
              </div>
              <i class="bi bi-graph-up-arrow text-primary fs-4"></i>
            </div>
            <div style="position:relative; height:260px;">
              <canvas id="borrowChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card stat-card p-3 p-lg-4 h-100">
            <div class="mb-3">
              <h2 class="h5 fw-semibold mb-0">Books by Category</h2>
              <p class="text-muted small mb-0">Distribution</p>
            </div>
            <div style="position:relative; height:260px;">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
        </div>
      </div>

    </main>

    <div id="footer"></div>
  </div>

  <!-- Bootstrap & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- Custom Scripts -->
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
  
  <script>
    Session.require();
    renderNavbar('dashboard');
    renderFooter();
  </script>
</body>
</html>
