<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View borrowing records and due dates." />
  <title>Borrowings | BookHive</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="app-wrapper">
    <div id="navbar"></div>

    <main class="container py-4 py-lg-5 flex-grow-1">
      
      <!-- Header Baru (Gaya Vintage) -->
      <div class="borrowings-header d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center">
          <div class="header-icon shadow-sm">
            <i class="bi bi-arrow-left-right"></i>
          </div>
          <div>
            <h1 class="h2 fw-bold mb-1">Borrowing Records</h1>
            <p class="text-muted mb-0">Track active loans, due dates, and statuses</p>
          </div>
        </div>
        
        <!-- Filter Buttons (Gaya Tabs) -->
        <div class="btn-group filter-group shadow-sm" role="group" id="filterGroup">
          <button class="btn btn-filter active" data-filter="all">All</button>
          <button class="btn btn-filter" data-filter="active">Active</button>
          <button class="btn btn-filter" data-filter="overdue">Overdue</button>
          <button class="btn btn-filter" data-filter="returned">Returned</button>
        </div>
      </div>

      <!-- Table Card -->
      <div class="card table-card border-0 shadow-sm mb-4">
        <div class="table-responsive">
          <table class="table align-middle mb-0" id="borrowTable">
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>MEMBER</th>
                <th>BOOK</th>
                <th><i class="bi bi-calendar3 me-1"></i> BORROW DATE</th>
                <th><i class="bi bi-calendar-check me-1"></i> DUE DATE</th>
                <th><i class="bi bi-tag me-1"></i> STATUS</th>
                <th class="text-end">ACTION</th>
              </tr>
            </thead>
            <tbody id="borrowBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Pagination & Info (Statik buat masa ini) -->
      <div class="d-flex justify-content-between align-items-center text-muted small">
        <div>Showing <span id="recordCount">0</span> records</div>
        <nav aria-label="Page navigation">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item disabled"><a class="page-link" href="#"><i class="bi bi-chevron-left"></i></a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item disabled"><a class="page-link" href="#"><i class="bi bi-chevron-right"></i></a></li>
          </ul>
        </nav>
      </div>

    </main>

    <div id="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/borrowings.js"></script>
  <script>
    Session.require();
    renderNavbar('borrowings');
    renderFooter();
  </script>
</body>
</html>
